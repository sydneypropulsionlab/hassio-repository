# Shared by the ingress and direct servers in taiga.conf. Each server sets
# $taiga_proto, $taiga_ws_proto, $taiga_host and $taiga_path before including
# this file.

large_client_header_buffers 4 32k;
client_max_body_size 50M;
charset utf-8;

# Keep redirects relative. Otherwise nginx makes them absolute using its own
# scheme and listen port (e.g. http://host:8081/admin/), which breaks access
# through a reverse proxy.
absolute_redirect off;

# Backend URLs (see backend_config.py). Listed first so the full scheme+host
# wins over the bare host.
sub_filter 'http://backend_host_placeholder' $taiga_proto://$taiga_host;
sub_filter 'backend_host_placeholder'  $taiga_host;
# Frontend conf.json
sub_filter 'proto_http_placeholder'    $taiga_proto;
sub_filter 'proto_ws_placeholder'      $taiga_ws_proto;
sub_filter 'host_to_be_replaced'       $taiga_host;
sub_filter '/ingress_path_placeholder' $taiga_path;
sub_filter_once off;
sub_filter_types *;

# Django builds redirects with the placeholder script name
proxy_redirect /ingress_path_placeholder/ $taiga_path/;
proxy_redirect http://backend_host_placeholder/ingress_path_placeholder/ $taiga_proto://$taiga_host$taiga_path/;

proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Scheme $scheme;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# sub_filter can't rewrite compressed responses
proxy_set_header Accept-Encoding "";

# Frontend
location / {
    proxy_pass http://127.0.0.1:8100/;
}

# API
location /api/ {
    proxy_pass http://127.0.0.1:8001/api/;
}

# Admin
location /admin/ {
    proxy_pass http://127.0.0.1:8001/admin/;
}

# Static files
location /static/ {
    alias /home/taiga/taiga-back/static/;
}

# Media
location /_protected/ {
    internal;
    alias /home/taiga/taiga-back/media/;
    # PDFs and images open in the browser, everything else downloads
    # ($taiga_media_disposition is set in taiga.conf)
    add_header Content-Disposition $taiga_media_disposition;
    add_header X-Content-Type-Options nosniff;
}

# Unprotected section
location /media/exports/ {
    alias /home/taiga/taiga-back/media/exports/;
    add_header Content-disposition "attachment";
}

location /media/ {
    proxy_pass http://127.0.0.1:8003/;
}

# Events
location /events {
    proxy_http_version 1.1;
    # Defining headers here drops the inherited ones, so repeat what's needed
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
    proxy_pass http://127.0.0.1:8888/events;
}
