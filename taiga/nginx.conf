log_format custom '$remote_addr - $remote_user [$time_local] '
                    '"$host" "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"'
                    '"$http_x_ingress_path" "$http_location"';

# The frontend conf.json/index.html and the backend's generated URLs contain
# placeholders which each public server below rewrites on the fly:
#   http://backend_host_placeholder -> scheme + host the browser used (backend)
#   proto_http_placeholder   -> http / https
#   proto_ws_placeholder     -> ws / wss
#   host_to_be_replaced      -> the host the browser used
#   /ingress_path_placeholder -> the ingress prefix, or nothing for direct access
# See taiga-locations.conf.

# Work out the scheme the browser really used for direct (non-ingress) access.
# Cloudflare sends CF-Visitor: {"scheme":"https"}, which survives Nginx Proxy
# Manager even when NPM itself is reached over plain http and overwrites
# X-Forwarded-Proto.
map $http_x_forwarded_proto $taiga_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}
map $http_cf_visitor $taiga_direct_proto {
    default  $taiga_forwarded_proto;
    "~*https" https;
}
map $taiga_direct_proto $taiga_direct_ws_proto {
    default ws;
    https   wss;
}

# Static frontend files (internal only, proxied by the servers below)
server {
    listen 8100;
    server_name _;

    large_client_header_buffers 4 32k;
    client_max_body_size 50M;
    charset utf-8;

    access_log /home/taiga/logs/nginx-f.access.log custom;
    error_log /home/taiga/logs/nginx-f.error.log;

    location / {
        alias /home/taiga/taiga-front-dist/dist/;
        gunzip on;
        index index.html;
        try_files $uri $uri/ index.html =404;
    }
}

# Home Assistant ingress
server {
    listen 8099;
    server_name _;

    allow  172.30.32.2;
    deny   all;

    access_log /home/taiga/logs/nginx.access.log custom;
    error_log /home/taiga/logs/nginx.error.log;

    set $taiga_proto    https;
    set $taiga_ws_proto wss;
    set $taiga_host     $host;
    # Sets $taiga_path to the ingress entry; written by start.sh
    include /etc/nginx/taiga-ingress-path.conf;

    include /etc/nginx/taiga-locations.conf;
}

# Direct access, e.g. http://<hass ip>:8081 or a reverse proxy such as
# Nginx Proxy Manager / Cloudflare Tunnel pointing at it
server {
    listen 8081;
    server_name _;

    access_log /home/taiga/logs/nginx-direct.access.log custom;
    error_log /home/taiga/logs/nginx.error.log;

    set $taiga_proto    $taiga_direct_proto;
    set $taiga_ws_proto $taiga_direct_ws_proto;
    # $http_host keeps any non-default port (e.g. 192.168.1.10:8081)
    set $taiga_host     $http_host;
    set $taiga_path     "";

    include /etc/nginx/taiga-locations.conf;
}
