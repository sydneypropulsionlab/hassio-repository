name: "Taiga Project Manager"
description: "Taiga Agile Project Manager"
version: "6.0.10-p13"
slug: "taiga"
init: false
arch:
  - amd64
  - armv7
options:
  taiga_secret_key: "pleasechange"
  rabbitmq_password: "pleasechange"
  postgres_password: "pleasechange"
  minutes_between_backups: 61
  rabbitmq_advanced_options:
    virtual_host: "taiga"
    host: "auto"
  postgres_advanced_options:
    host: "auto"
    user: 'taiga'
    database: 'taiga'
  smtp:
    port: 587
    security: "starttls"
schema:
  taiga_secret_key: "password"
  rabbitmq_password: "password"
  postgres_password: "password"
  minutes_between_backups: "float"
  rabbitmq_advanced_options:
    virtual_host: "str"
    host: "str?"
  postgres_advanced_options: 
    host: 'str'
    user: 'str'
    database: 'str'
  smtp:
    host: "str?"
    port: "port"
    security: "list(starttls|ssl|none)"
    username: "str?"
    password: "password?"
    from_email: "email?"
ingress: 8099
ingress_port: 8099
ingress_entry: "/discover"
ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: "Direct web access (e.g. for a reverse proxy). Leave blank to disable."
hassio_api: true
panel_icon: "mdi:octagram"
map:
  - "share:rw"
